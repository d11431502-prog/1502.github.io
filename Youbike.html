<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike 2.0 即時資訊儀表板</title>
    
    <!-- 引入 Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 引入 Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* CSS 變數定義，方便管理顏色與排版 */
        :root {
            --primary-color: #00A1E9; /* YouBike 經典藍 */
            --secondary-color: #F8B62D; /* YouBike 經典黃 */
            --bg-color: #f4f7f6;
            --text-dark: #333333;
            --text-light: #777777;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px; /* 稍微加寬以容納地圖 */
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .fetch-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .fetch-btn:hover {
            background-color: #0088c7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 161, 233, 0.3);
        }

        .fetch-btn:active {
            transform: translateY(0);
        }

        .fetch-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #e0e0e0;
            border-left: 5px solid var(--secondary-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.5s ease forwards;
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            cursor: pointer; /* 新增游標樣式指示可點擊 */
        }

        .card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transform: translateY(-3px); /* 點擊互動感：滑鼠懸停時微微上浮 */
        }

        /* 動態設定動畫延遲，產生漸次出現的效果 */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }

        .station-info h2 {
            font-size: 16px;
            margin-bottom: 4px;
            color: var(--text-dark);
        }

        .station-info p {
            font-size: 13px;
            color: var(--text-light);
        }

        .bike-status {
            text-align: right;
        }

        .bike-count {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .bike-label {
            font-size: 12px;
            color: var(--text-light);
        }

        .message {
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            padding: 20px 0;
        }

        .error-message {
            color: #e74c3c;
        }

        .update-time {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        /* 地圖容器樣式 */
        #map {
            height: 380px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            z-index: 1; /* 避免覆蓋其他下拉選單或 UI */
            border: 1px solid #e0e0e0;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>🚲 YouBike 即時動態儀表板</h1>
            <p>掌握台北市最新的單車租借資訊</p>
        </div>

        <button id="fetch-btn" class="fetch-btn">查詢最新前五筆站點</button>

        <p id="update-time-display" class="update-time"></p>

        <!-- 新增地圖容器 -->
        <div id="map"></div>

        <div id="data-container" class="data-list">
            <!-- 資料卡片將會透過 JavaScript 動態產生在這裡 -->
            <div class="message">點擊上方按鈕開始抓取資料</div>
        </div>
    </div>

    <script>
        // 綁定 DOM 元素
        const fetchBtn = document.getElementById('fetch-btn');
        const dataContainer = document.getElementById('data-container');
        const updateTimeDisplay = document.getElementById('update-time-display');
        
        // YouBike 2.0 即時資訊 API 網址
        const API_URL = 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json';

        // 初始化 Leaflet 地圖 (預設中心點設為台北市政府周邊)
        const map = L.map('map').setView([25.0375, 121.5644], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // 建立一個圖層群組來放置站點標記，方便後續每次更新時清除舊標記
        const markersLayer = L.layerGroup().addTo(map);

        // 新增一個物件來儲存地圖標記，以便透過列表點擊時對應
        let stationMarkers = {};

        // 獨立出抓取資料的非同步函數，方便手動與自動重複呼叫
        async function fetchYouBikeData() {
            // 更新 UI 狀態為載入中
            fetchBtn.disabled = true;
            fetchBtn.textContent = '資料載入中...';
            
            // 如果是初次載入，顯示連線提示訊息（後續自動刷新時保留原畫面，避免閃爍）
            if (dataContainer.innerHTML.includes('點擊上方按鈕開始抓取資料')) {
                dataContainer.innerHTML = '<div class="message">正在連線至政府開放資料平台...</div>';
            }

            try {
                // 發送 HTTP GET 請求
                const response = await fetch(API_URL);
                
                // 檢查回應狀態
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤狀態碼：${response.status}`);
                }

                // 解析 JSON 資料
                const data = await response.json();
                
                // 擷取前五筆資料
                const topFiveStations = data.slice(0, 5);
                
                // 取得資料陣列中的更新時間 (取第一筆作為代表)
                if (data.length > 0 && data[0].updateTime) {
                    updateTimeDisplay.textContent = `最後刷新時間：${data[0].updateTime} (每30秒自動刷新)`;
                }

                // 渲染資料至下方列表
                renderData(topFiveStations);
                
                // 渲染所有站點至地圖
                renderMapMarkers(data);

            } catch (error) {
                // 錯誤處理：顯示錯誤訊息於畫面
                console.error('抓取資料失敗:', error);
                dataContainer.innerHTML = `
                    <div class="message error-message">
                        ⚠️ 無法取得資料，請檢查網路連線或稍後再試。<br>
                        <small>錯誤詳情: ${error.message}</small>
                    </div>
                `;
            } finally {
                // 恢復按鈕狀態
                fetchBtn.disabled = false;
                fetchBtn.textContent = '手動更新資訊';
            }
        }

        // 綁定按鈕點擊事件，允許使用者手動觸發刷新
        fetchBtn.addEventListener('click', fetchYouBikeData);

        // 設定定時器，每 30 秒 (30000 毫秒) 自動刷新一次
        setInterval(fetchYouBikeData, 30000);

        // 網頁一開啟即自動執行第一次資料抓取
        fetchYouBikeData();

        /**
         * 將資料陣列轉換為 HTML 結構並渲染到畫面上
         * @param {Array} stations - 包含站點資訊的陣列
         */
        function renderData(stations) {
            // 清空容器
            dataContainer.innerHTML = '';

            // 遍歷資料陣列並產生卡片
            stations.forEach(station => {
                // 淨化站點名稱（移除前面的 "YouBike2.0_" 字串，讓畫面更乾淨）
                const cleanName = station.sna.replace('YouBike2.0_', '');
                
                // 相容性處理：API 欄位可能為 available_rent_bikes 或 sbi (可借車數)
                const availableBikes = station.available_rent_bikes ?? station.sbi ?? 0;

                // 建立卡片元素
                const card = document.createElement('div');
                card.className = 'card';
                card.title = "點擊在地圖上查看此站點";
                
                // 填入卡片 HTML 內容
                card.innerHTML = `
                    <div class="station-info">
                        <h2>${cleanName}</h2>
                        <p>📍 ${station.sarea} | 總車位: ${station.Quantity ?? station.tot}</p>
                    </div>
                    <div class="bike-status">
                        <div class="bike-count">${availableBikes}</div>
                        <div class="bike-label">可借車輛</div>
                    </div>
                `;
                
                // 新增點擊事件：點擊卡片時讓地圖移動至該站點並開啟資訊氣泡
                card.addEventListener('click', () => {
                    const lat = station.lat ?? station.latitude;
                    const lng = station.lng ?? station.longitude;
                    const marker = stationMarkers[station.sno];

                    if (lat && lng) {
                        // 平滑移動地圖至該站點 (緯度, 經度, 縮放級別)
                        map.flyTo([lat, lng], 17, {
                            animate: true,
                            duration: 1.0
                        });
                        
                        // 展開該站點的標記資訊
                        if (marker) {
                            // 稍微延遲開啟 popup，讓地圖有時間飛過去
                            setTimeout(() => marker.openPopup(), 400);
                        }
                    }
                });

                // 將卡片加入容器中
                dataContainer.appendChild(card);
            });
        }

        /**
         * 將站點資料渲染為地圖上的標記 (Markers)
         * @param {Array} stations - 包含所有站點資訊的陣列
         */
        function renderMapMarkers(stations) {
            // 清空舊的標記
            markersLayer.clearLayers();
            stationMarkers = {}; // 重新整理時清空標記對應表
            
            // 用來記錄所有標記的經緯度，以便自動調整地圖縮放範圍
            const bounds = [];

            stations.forEach(station => {
                const lat = station.lat ?? station.latitude;
                const lng = station.lng ?? station.longitude;
                
                // 確保經緯度存在才加上標記
                if (lat && lng) {
                    const cleanName = station.sna.replace('YouBike2.0_', '');
                    const availableBikes = station.available_rent_bikes ?? station.sbi ?? 0;
                    const totalBikes = station.Quantity ?? station.tot;
                    
                    // 建立標記並綁定點擊後顯示的氣泡資訊 (Popup)
                    const marker = L.marker([lat, lng]);
                    marker.bindPopup(`
                        <div style="font-size: 14px;">
                            <strong style="font-size: 16px;">${cleanName}</strong><br>
                            <span style="color: #666;">📍 ${station.sarea}</span><br>
                            <hr style="margin: 8px 0; border-top: 1px solid #eee;">
                            可借車輛: <span style="color: #00A1E9; font-weight: bold; font-size: 16px;">${availableBikes}</span><br>
                            總車位: ${totalBikes}
                        </div>
                    `);
                    
                    markersLayer.addLayer(marker);
                    bounds.push([lat, lng]);

                    // 將標記存入對應表 (使用站點代碼 sno 作為唯一索引)
                    stationMarkers[station.sno] = marker;
                }
            });

            // 如果有站點，自動將地圖縮放並平移，使所有標記都能顯示在畫面中
            if (bounds.length > 0) {
                map.fitBounds(bounds);
            }
        }
    </script>
</body>
</html>
