<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 數位影像工作坊 Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --accent-blue: #3b82f6;
        }

        body {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .workshop-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
        }

        .sidebar {
            background-color: var(--panel-dark);
            border-right: 1px solid #334155;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        .preview-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
            overflow: auto;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), 
                              linear-gradient(-45deg, #222 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #222 75%), 
                              linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
        }

        canvas { display: block; cursor: crosshair; }

        .control-group {
            background: rgba(15, 23, 42, 0.4);
            padding: 1rem;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border: 1px solid #334155;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn {
            padding: 0.5rem 0.75rem;
            border-radius: 0.4rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            border: 1px solid #475569;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); }
        .btn-active { background: var(--accent-blue); border-color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-red { color: #f87171; border-color: rgba(153, 27, 27, 0.4); }

        input[type="range"] { accent-color: var(--accent-blue); width: 100%; height: 4px; }
        
        #cropOverlay {
            position: absolute;
            border: 2px dashed #fff;
            background: rgba(255, 255, 255, 0.1);
            display: none;
            pointer-events: none;
        }

        .label-row { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="workshop-container">
    <aside class="sidebar">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold">Studio <span class="text-blue-500">Ultimate</span></h1>
            <button id="undoBtn" class="btn text-[10px] px-2 py-1" disabled onclick="undo()">復原</button>
        </div>

        <!-- 1. 檔案與重置 -->
        <div class="control-group">
            <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">上傳影像</button>
            <input type="file" id="imageInput" class="hidden" accept="image/*">
            <div class="grid grid-cols-2 gap-2">
                <button id="downloadBtn" class="btn" disabled onclick="downloadImage()">下載</button>
                <button class="btn btn-red" onclick="resetToOriginal()">重置</button>
            </div>
        </div>

        <!-- 2. 構圖與裁切 -->
        <div class="control-group">
            <span class="section-title">構圖變換</span>
            <div class="grid grid-cols-3 gap-1">
                <button class="btn px-1" onclick="rotate(90)">旋轉</button>
                <button class="btn px-1" onclick="flip()">翻轉</button>
                <button id="cropToolBtn" class="btn px-1 btn-tool" onclick="setTool('crop')">裁切</button>
            </div>
            <button id="applyCropBtn" class="btn bg-green-600 border-none hidden" onclick="applyCrop()">執行裁切</button>
        </div>

        <!-- 3. 專業濾鏡庫 -->
        <div class="control-group">
            <span class="section-title">專業濾鏡</span>
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-grayscale" class="btn filter-btn" onclick="toggleFilter('grayscale')">黑白</button>
                <button id="btn-sepia" class="btn filter-btn" onclick="toggleFilter('sepia')">復古</button>
                <button id="btn-invert" class="btn filter-btn" onclick="toggleFilter('invert')">負片</button>
                <button id="btn-sharpen" class="btn filter-btn" onclick="toggleFilter('sharpen')">銳化</button>
            </div>
        </div>

        <!-- 4. 滑桿調控 -->
        <div class="control-group">
            <span class="section-title">影像微調</span>
            <div>
                <div class="label-row"><span>亮度</span><span id="lbl-brightness">100%</span></div>
                <input type="range" id="rng-brightness" min="0" max="200" value="100" onchange="pushHistory()">
            </div>
            <div>
                <div class="label-row"><span>對比</span><span id="lbl-contrast">100%</span></div>
                <input type="range" id="rng-contrast" min="0" max="200" value="100" onchange="pushHistory()">
            </div>
            <div>
                <div class="label-row"><span>模糊</span><span id="lbl-blur">0px</span></div>
                <input type="range" id="rng-blur" min="0" max="10" step="0.5" value="0" onchange="pushHistory()">
            </div>
            <div>
                <div class="label-row"><span>色溫</span><span id="lbl-temp">0</span></div>
                <input type="range" id="rng-temp" min="-50" max="50" value="0" onchange="pushHistory()">
            </div>
        </div>

        <!-- 5. 進階工具 -->
        <div class="control-group">
            <span class="section-title">進階編輯</span>
            <button id="brushToolBtn" class="btn btn-tool" onclick="setTool('brush')">馬賽克畫筆</button>
            <div class="flex items-center gap-2">
                <input type="color" id="chromaColor" value="#00ff00" class="h-8 w-10 bg-transparent border-none">
                <button class="btn flex-1" onclick="applyChromakey()">執行去背</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="wmText" placeholder="浮水印..." class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs flex-1">
                <button class="btn" onclick="applyWatermark()">添加</button>
            </div>
        </div>
    </aside>

    <main class="preview-area">
        <div id="emptyState" class="text-slate-500 text-center">
            <p>請上傳影像以開始編輯</p>
        </div>
        <div class="canvas-container" id="canvasBox">
            <canvas id="mainCanvas" class="hidden"></canvas>
            <div id="cropOverlay"></div>
        </div>
    </main>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const imageInput = document.getElementById('imageInput');
    const undoBtn = document.getElementById('undoBtn');
    const cropOverlay = document.getElementById('cropOverlay');

    let originalImage = null;
    let mosaicLayer = null;
    let history = [];
    let watermark = "";
    let activeTool = null; // 'crop', 'brush'
    let isDrawing = false;
    let cropStart = { x: 0, y: 0 };
    let cropArea = { x: 0, y: 0, w: 0, h: 0 };

    let state = {
        grayscale: false, invert: false, sepia: false, sharpen: false,
        brightness: 100, contrast: 100, blur: 0, temp: 0,
        rotation: 0, flipped: false
    };

    // --- 初始化 ---
    imageInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                // 先設定畫布尺寸與建立層級，再執行 reset
                setupCanvas(img.width, img.height);
                resetToOriginal(false);
                document.getElementById('emptyState').classList.add('hidden');
                canvas.classList.remove('hidden');
                document.getElementById('downloadBtn').disabled = false;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function setupCanvas(w, h) {
        const max = 1200;
        const scale = Math.min(1, max / Math.max(w, h));
        canvas.width = w * scale;
        canvas.height = h * scale;
        
        // 確保 mosaicLayer 隨時存在且尺寸正確
        if (!mosaicLayer || mosaicLayer.width !== canvas.width || mosaicLayer.height !== canvas.height) {
            const oldMosaic = mosaicLayer;
            mosaicLayer = document.createElement('canvas');
            mosaicLayer.width = canvas.width;
            mosaicLayer.height = canvas.height;
            // 如果是調整尺寸而非新圖，可考慮保留舊塗鴉，但此處為簡化邏輯採重置
        }
    }

    // --- 歷史紀錄 ---
    function pushHistory() {
        if (!mosaicLayer) return;
        history.push(JSON.stringify({ state: {...state}, watermark, mosaic: mosaicLayer.toDataURL() }));
        if (history.length > 15) history.shift();
        undoBtn.disabled = false;
    }

    async function undo() {
        if (history.length === 0) return;
        const last = JSON.parse(history.pop());
        state = last.state;
        watermark = last.watermark;
        
        const mImg = new Image();
        mImg.onload = () => {
            const mCtx = mosaicLayer.getContext('2d');
            mCtx.clearRect(0,0,canvas.width,canvas.height);
            mCtx.drawImage(mImg, 0, 0);
            syncUI();
            render();
        };
        mImg.src = last.mosaic;
        if (history.length === 0) undoBtn.disabled = true;
    }

    // --- 工具管理 ---
    function setTool(tool) {
        activeTool = (activeTool === tool) ? null : tool;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('btn-active'));
        if (activeTool) {
            const btn = document.getElementById(`${tool}ToolBtn`);
            if(btn) btn.classList.add('btn-active');
        }
        cropOverlay.style.display = 'none';
        document.getElementById('applyCropBtn').classList.add('hidden');
    }

    // --- 互動監聽 ---
    canvas.addEventListener('mousedown', e => {
        if (!activeTool) return;
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (activeTool === 'crop') {
            cropStart = { x, y };
            cropOverlay.style.display = 'block';
            document.getElementById('applyCropBtn').classList.remove('hidden');
        } else if (activeTool === 'brush') {
            pushHistory();
            drawMosaic(x, y);
        }
    });

    window.addEventListener('mousemove', e => {
        if (!isDrawing || !activeTool) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(canvas.width, e.clientX - rect.left));
        const y = Math.max(0, Math.min(canvas.height, e.clientY - rect.top));

        if (activeTool === 'crop') {
            cropArea = { 
                x: Math.min(x, cropStart.x), 
                y: Math.min(y, cropStart.y), 
                w: Math.abs(x - cropStart.x), 
                h: Math.abs(y - cropStart.y) 
            };
            Object.assign(cropOverlay.style, { 
                left: cropArea.x+'px', 
                top: cropArea.y+'px', 
                width: cropArea.w+'px', 
                height: cropArea.h+'px' 
            });
        } else if (activeTool === 'brush') {
            drawMosaic(x, y);
        }
    });

    window.addEventListener('mouseup', () => isDrawing = false);

    // --- 核心功能函數 ---
    function drawMosaic(x, y) {
        if (!mosaicLayer) return;
        const size = 30;
        const mCtx = mosaicLayer.getContext('2d');
        const mosaicBlock = 10;
        
        mCtx.save();
        mCtx.beginPath(); 
        mCtx.arc(x, y, size/2, 0, Math.PI*2); 
        mCtx.clip();
        
        mCtx.drawImage(canvas, x-size/2, y-size/2, size, size, x-size/2, y-size/2, size, size);
        const id = mCtx.getImageData(x-size/2, y-size/2, size, size);
        for(let j=0; j<id.height; j+=mosaicBlock) {
            for(let i=0; i<id.width; i+=mosaicBlock) {
                const idx = (j * id.width + i) * 4;
                mCtx.fillStyle = `rgb(${id.data[idx]},${id.data[idx+1]},${id.data[idx+2]})`;
                mCtx.fillRect(x-size/2+i, y-size/2+j, mosaicBlock, mosaicBlock);
            }
        }
        mCtx.restore();
        render();
    }

    function applyChromakey() {
        pushHistory();
        const hex = document.getElementById('chromaColor').value;
        const rT = parseInt(hex.slice(1,3), 16), gT = parseInt(hex.slice(3,5), 16), bT = parseInt(hex.slice(5,7), 16);
        const id = ctx.getImageData(0,0,canvas.width,canvas.height);
        for(let i=0; i<id.data.length; i+=4) {
            const d = Math.sqrt((id.data[i]-rT)**2 + (id.data[i+1]-gT)**2 + (id.data[i+2]-bT)**2);
            if(d < 40) id.data[i+3] = 0;
        }
        const tmp = document.createElement('canvas');
        tmp.width = canvas.width; tmp.height = canvas.height;
        tmp.getContext('2d').putImageData(id, 0, 0);
        originalImage = tmp;
        render();
    }

    function applyCrop() {
        if(cropArea.w < 10) return;
        pushHistory();
        const tmp = document.createElement('canvas');
        tmp.width = cropArea.w; tmp.height = cropArea.h;
        tmp.getContext('2d').drawImage(canvas, cropArea.x, cropArea.y, cropArea.w, cropArea.h, 0, 0, cropArea.w, cropArea.h);
        originalImage = tmp;
        setupCanvas(tmp.width, tmp.height);
        setTool(null);
        render();
    }

    function rotate(deg) { pushHistory(); state.rotation = (state.rotation + deg) % 360; render(); }
    function flip() { pushHistory(); state.flipped = !state.flipped; render(); }
    function toggleFilter(f) { pushHistory(); state[f] = !state[f]; syncUI(); render(); }
    function applyWatermark() { pushHistory(); watermark = document.getElementById('wmText').value; render(); }

    function syncUI() {
        ['brightness','contrast','blur','temp'].forEach(k => {
            const el = document.getElementById(`rng-${k}`);
            const lbl = document.getElementById(`lbl-${k}`);
            if(el) el.value = state[k];
            if(lbl) lbl.innerText = state[k] + (k==='blur'?'px':k==='temp'?'':'%');
        });
        ['grayscale','sepia','invert','sharpen'].forEach(k => {
            const btn = document.getElementById(`btn-${k}`);
            if(btn) btn.classList.toggle('btn-active', state[k]);
        });
    }

    // --- 渲染引擎 ---
    function render() {
        if (!originalImage) return;
        const isVert = (state.rotation / 90) % 2 !== 0;
        const w = isVert ? originalImage.height : originalImage.width;
        const h = isVert ? originalImage.width : originalImage.height;
        
        // 渲染時不應隨意 setupCanvas 否則會無限重繪或遺失馬賽克層，除非尺寸真的變了
        if(canvas.width !== Math.floor(w * (Math.min(1, 1200 / Math.max(w, h))))) {
             setupCanvas(w, h);
        }

        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.save();
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(state.rotation * Math.PI / 180);
        if(state.flipped) ctx.scale(-1, 1);
        ctx.filter = `blur(${state.blur}px)`;
        
        // 根據旋轉狀態計算繪製比例
        const drawW = isVert ? canvas.height : canvas.width;
        const drawH = isVert ? canvas.width : canvas.height;
        ctx.drawImage(originalImage, -drawW/2, -drawH/2, drawW, drawH);
        ctx.restore();
        ctx.filter = 'none';

        let id = ctx.getImageData(0,0,canvas.width,canvas.height);
        if(state.sharpen) id.data.set(applySharpen(id.data, canvas.width, canvas.height));

        const b = state.brightness/100, c = state.contrast/100, t = state.temp;
        for(let i=0; i<id.data.length; i+=4) {
            for(let j=0; j<3; j++) {
                let v = id.data[i+j];
                v = v * b; // 亮度
                v = c * (v - 128) + 128; // 對比
                if(j===0) v += t; if(j===2) v -= t; // 色溫
                id.data[i+j] = Math.max(0, Math.min(255, v));
            }
            if(state.sepia) {
                const r = id.data[i], g = id.data[i+1], b_ = id.data[i+2];
                id.data[i] = (r*.393)+(g*.769)+(b_*.189);
                id.data[i+1] = (r*.349)+(g*.686)+(b_*.168);
                id.data[i+2] = (r*.272)+(g*.534)+(b_*.131);
            }
            if(state.grayscale) {
                const v = id.data[i]*0.299 + id.data[i+1]*0.587 + id.data[i+2]*0.114;
                id.data[i] = id.data[i+1] = id.data[i+2] = v;
            }
            if(state.invert) { 
                id.data[i]=255-id.data[i]; 
                id.data[i+1]=255-id.data[i+1]; 
                id.data[i+2]=255-id.data[i+2]; 
            }
        }
        ctx.putImageData(id, 0, 0);
        if(mosaicLayer) ctx.drawImage(mosaicLayer, 0, 0);
        if(watermark) {
            ctx.font = `bold ${canvas.width*0.04}px sans-serif`; 
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.textAlign = "right"; 
            ctx.fillText(watermark, canvas.width-20, canvas.height-20);
        }
    }

    function applySharpen(s, w, h) {
        const k = [0,-1,0,-1,5,-1,0,-1,0], r = new Uint8ClampedArray(s.length);
        for(let y=1; y<h-1; y++) for(let x=1; x<w-1; x++) {
            const i = (y*w+x)*4;
            for(let c=0; c<3; c++) {
                let v = 0; 
                for(let j=-1; j<=1; j++) 
                    for(let l=-1; l<=1; l++) 
                        v += s[((y+j)*w+(x+l))*4+c] * k[(j+1)*3+(l+1)];
                r[i+c] = v;
            }
            r[i+3] = s[i+3];
        }
        return r;
    }

    // --- 滑桿即時更新 ---
    ['brightness','contrast','blur','temp'].forEach(k => {
        const el = document.getElementById(`rng-${k}`);
        if(el) {
            el.addEventListener('input', e => {
                state[k] = parseFloat(e.target.value);
                syncUI(); render();
            });
        }
    });

    function resetToOriginal(reload=true) {
        if(reload) { location.reload(); return; }
        state = { 
            grayscale: false, invert: false, sepia: false, sharpen: false, 
            brightness: 100, contrast: 100, blur: 0, temp: 0, rotation: 0, flipped: false 
        };
        watermark = ""; 
        history = []; 
        undoBtn.disabled = true;
        
        if (mosaicLayer) {
            const mCtx = mosaicLayer.getContext('2d'); 
            mCtx.clearRect(0,0,mosaicLayer.width,mosaicLayer.height);
        }
        syncUI(); 
        render();
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = `Studio-Ultimate-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>
</body>
</html>
